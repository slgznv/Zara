<!DOCTYPE html>
<html>
  <body>
    <svg width="800" height="600">
      <!-- Блочный тепловой пункт -->
      <rect x="50" y="50" width="200" height="100" fill="lightblue" stroke="black" stroke-width="2"/>
      <text x="75" y="35" font-size="14" fill="black">Блочный тепловой пункт</text>
      <line x1="250" y1="100" x2="300" y2="100" stroke="black" stroke-width="2" />
      <circle cx="325" cy="100" r="25" fill="lightgreen" stroke="black" stroke-width="2" />
      <text x="310" y="105" font-size="12" fill="black">Клапан</text>

      <!-- Водопроводная насосная станция -->
      <rect x="50" y="200" width="200" height="100" fill="lightyellow" stroke="black" stroke-width="2"/>
      <text x="75" y="185" font-size="14" fill="black">Водопроводная насосная станция</text>
      <line x1="250" y1="250" x2="300" y2="250" stroke="black" stroke-width="2" />
      <circle cx="325" cy="250" r="25" fill="orange" stroke="black" stroke-width="2" />
      <text x="310" y="255" font-size="12" fill="black">Насос</text>

      <!-- Противопожарная насосная станция -->
      <rect x="50" y="350" width="200" height="100" fill="lightcoral" stroke="black" stroke-width="2"/>
      <text x="75" y="335" font-size="14" fill="black">Противопожарная насосная станция</text>
      <line x1="250" y1="400" x2="300" y2="400" stroke="black" stroke-width="2" />
      <circle cx="325" cy="400" r="25" fill="lightblue" stroke="black" stroke-width="2" />
      <text x="310" y="405" font-size="12" fill="black">Насос</text>

      <!-- Общие связи между объектами -->
      <line x1="350" y1="100" x2="400" y2="100" stroke="black" stroke-width="2" />
      <line x1="350" y1="250" x2="400" y2="250" stroke="black" stroke-width="2" />
      <line x1="350" y1="400" x2="400" y2="400" stroke="black" stroke-width="2" />
      <text x="410" y="100" font-size="12" fill="black">Теплосеть</text>
      <text x="410" y="250" font-size="12" fill="black">Водоснабжение</text>
      <text x="410" y="400" font-size="12" fill="black">Пожарная система</text>
    </svg>
  </body>
</html>
